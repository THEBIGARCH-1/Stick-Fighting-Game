<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Battle</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #instructions {
            position: absolute;
            top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h2>Stickman Controls</h2>
        <p><strong>Right Arrow:</strong> Move Forward | <strong>Shift:</strong> Sprint | <strong>Ctrl:</strong> Crawl</p>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Load the sprite sheet
        const spriteSheet = new Image();
        spriteSheet.src = 'stickman_sprites.png'; 

        // Sprite sheet dimensions (6 columns, 3 rows)
        const cols = 6;
        const rows = 3;
        let spriteWidth, spriteHeight;

        // Player object
        const player = {
            x: 50,
            y: 200,
            width: 0, 
            height: 0,
            frameX: 0, // Current frame in the row
            frameY: 0, // Current row (0=walk, 1=sprint, 2=crawl)
            speed: 0,
            isMoving: false
        };

        // Animation timing
        let gameFrame = 0;
        const staggerFrames = 8; // Higher number = slower animation

        // Input tracking
        const keys = {
            ArrowRight: false,
            Shift: false,
            Control: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Initialize sprite dimensions once the image loads
        spriteSheet.onload = () => {
            spriteWidth = spriteSheet.width / cols;
            spriteHeight = spriteSheet.height / rows;
            player.width = spriteWidth;
            player.height = spriteHeight;
            animate();
        };

        // Tell us if the image is missing!
        spriteSheet.onerror = () => {
            alert("ERROR: I cannot find 'stickman_sprites.png'! Make sure the image is in the EXACT same folder as this HTML file and the name is perfectly matched.");
        };

        function updatePlayer() {
            player.isMoving = false;
            player.speed = 0;

            // Determine Action based on keys
            if (keys.ArrowRight) {
                player.isMoving = true;
                
                if (keys.Control) {
                    // Crawl (Bottom Row)
                    player.frameY = 2;
                    player.speed = 1;
                } else if (keys.Shift) {
                    // Sprint (Middle Row)
                    player.frameY = 1;
                    player.speed = 5;
                } else {
                    // Walk (Top Row)
                    player.frameY = 0;
                    player.speed = 2.5;
                }

                // Move player right (wrap around screen)
                player.x += player.speed;
                if (player.x > canvas.width) player.x = -player.width;
            } else {
                // Return to idle (first frame of walking) if not moving
                player.frameX = 0;
                player.frameY = 0;
            }

            // Animate frames if moving
            if (player.isMoving) {
                if (gameFrame % staggerFrames === 0) {
                    if (player.frameX < cols - 1) {
                        player.frameX++;
                    } else {
                        player.frameX = 0;
                    }
                }
            }
        }

        function drawPlayer() {
            ctx.drawImage(
                spriteSheet, 
                player.frameX * spriteWidth, // Source X
                player.frameY * spriteHeight, // Source Y
                spriteWidth, // Source Width
                spriteHeight, // Source Height
                player.x, // Destination X
                player.y, // Destination Y
                player.width, // Destination Width
                player.height // Destination Height
            );
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updatePlayer();
            drawPlayer();
            
            gameFrame++;
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
