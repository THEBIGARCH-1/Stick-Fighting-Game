<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Drawn Stickman Battle</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #instructions {
            position: absolute;
            top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h2>Pure Code Stickman Controls</h2>
        <p><strong>D:</strong> Move Right | <strong>A:</strong> Move Left | <strong>Shift:</strong> Sprint | <strong>Ctrl:</strong> Crawl</p>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player object created purely with code coordinates
        const player = {
            x: 100,
            y: 260, // Baseline ground level for standing
            speed: 0,
            direction: 1, // 1 for right, -1 for left
            action: 'idle', // 'idle', 'walk', 'sprint', 'crawl'
            animFrame: 0
        };

        // Input tracking for WASD and modifiers
        const keys = {
            KeyD: false,
            KeyA: false,
            Shift: false,
            Control: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if (e.key === 'Shift') keys.Shift = true;
            if (e.key === 'Control') keys.Control = true;
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
            if (e.key === 'Shift') keys.Shift = false;
            if (e.key === 'Control') keys.Control = false;
        });

        function updatePlayer() {
            player.speed = 0;
            player.action = 'idle';

            let isMovingHorizontally = keys.KeyD || keys.KeyA;

            if (isMovingHorizontally) {
                if (keys.KeyD) {
                    player.direction = 1;
                } else if (keys.KeyA) {
                    player.direction = -1;
                }

                if (keys.Control) {
                    player.action = 'crawl';
                    player.speed = 1.5;
                    player.y = 300; // Lower position for crawling
                } else if (keys.Shift) {
                    player.action = 'sprint';
                    player.speed = 5;
                    player.y = 260;
                } else {
                    player.action = 'walk';
                    player.speed = 2.5;
                    player.y = 260;
                }

                player.x += player.speed * player.direction;
                player.animFrame += 0.15; // Drives leg/arm swinging animation
            } else {
                player.y = 260;
                player.animFrame = 0;
            }

            // Screen boundaries wrap around
            if (player.x > canvas.width + 20) player.x = -20;
            if (player.x < -20) player.x = canvas.width + 20;
        }

        function drawStickman() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // If facing left, flip the drawing canvas horizontally
            if (player.direction === -1) {
                ctx.scale(-1, 1);
            }

            // Stickman styling
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
            ctx.fillStyle = '#000000';
            ctx.lineCap = 'round';

            let swing = Math.sin(player.animFrame) * 15;

            if (player.action === 'crawl') {
                // --- CRAWLING POSE (Drawn with code) ---
                // Head
                ctx.beginPath();
                ctx.arc(20, -15, 10, 0, Math.PI * 2);
                ctx.fill();

                // Body (Horizontal)
                ctx.beginPath();
                ctx.moveTo(-15, -15);
                ctx.lineTo(25, -15);
                ctx.stroke();

                // Arms and legs bent for crawling motion
                ctx.beginPath();
                // Front arm/leg
                ctx.moveTo(15, -15);
                ctx.lineTo(20 + swing, 0);
                ctx.moveTo(-10, -15);
                ctx.lineTo(-5 - swing, 0);
                // Back limbs
                ctx.moveTo(5, -15);
                ctx.lineTo(10 - swing, 0);
                ctx.stroke();

            } else {
                // --- STANDING / WALKING / SPRINTING POSE (Drawn with code) ---
                let bodyHeight = 50;
                
                // Head
                ctx.beginPath();
                ctx.arc(0, -bodyHeight - 12, 10, 0, Math.PI * 2);
                ctx.fill();

                // Torso
                ctx.beginPath();
                ctx.moveTo(0, -bodyHeight);
                ctx.lineTo(0, -15);
                ctx.stroke();

                // Arms (swinging if moving)
                ctx.beginPath();
                ctx.moveTo(0, -bodyHeight + 10);
                ctx.lineTo(15 + swing, -20);
                ctx.moveTo(0, -bodyHeight + 10);
                ctx.lineTo(-15 - swing, -20);
                ctx.stroke();

                // Legs (walking/sprinting strides)
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(15 + swing, 0);
                ctx.moveTo(0, -15);
                ctx.lineTo(-15 - swing, 0);
                ctx.stroke();
            }

            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw a simple ground line
            ctx.beginPath();
            ctx.moveTo(0, 310);
            ctx.lineTo(800, 310);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            updatePlayer();
            drawStickman();
            
            requestAnimationFrame(animate);
        }

        // Start game loop
        animate();
    </script>
</body>
</html>
